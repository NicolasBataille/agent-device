name: 1874 Diagnose

# Forces the #1874 commit-stall question instead of waiting for a red lane: loops the one test
# whose failures the issue records, on real CI hardware, across both arches and with/without the
# neighbour test that shares the simulator.
#
# Under the lane rule in #1781:
#
#   - Catches: iOS text-entry commit episodes — the simulator input pipeline delivering
#     synthesized characters slowly enough to matter. Since #2035 the commit wait absorbs an
#     episode that keeps making progress, so an episode now surfaces as a SLOW PASS rather than a
#     failure. This loop records the per-iteration cadence either way, which is the evidence
#     #1874 is still open for.
#   - Evidence: the 2026-08-21 dispatch passed 50/50 yet caught a sub-critical episode
#     (`type-all` 2487 ms across 5 polls) that no PR lane would have reported. The issue's table
#     also records that the episode does not reproduce locally.
#   - Cost: nothing while idle — `workflow_dispatch` only, and the `push:` branch does not exist
#     on origin. A dispatch is four macOS concurrency slots, each a runner build plus `iterations`
#     iterations of simulator time. It adds nothing to any PR. The `gate: swift-runner-ios` below
#     is the shared build action's input, not an ownership claim: ios.yml owns that gate, so
#     `pnpm check:gate-manifest` neither needs nor gets a declaration for this file.
#   - Kill criterion: delete this file in the commit that closes #1874. It answers exactly one
#     open question — why the pipeline throttles — and nothing else reads its artifacts.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Loop iterations per job'
        required: false
        default: '25'
  push:
    branches:
      - diagnose/1874-commit-stall

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stall-loop:
    name: ${{ matrix.arch }} ${{ matrix.mode }} stall loop
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [isolated, pair]
        arch: [x86_64, arm64]
    env:
      IOS_RUNTIME_VERSION: '26.2'
      AGENT_DEVICE_IOS_RUNNER_DERIVED_PATH: ${{ github.workspace }}/.tmp/ios-runner-derived
      AGENT_DEVICE_XCUITEST_INCLUDE_UNIT_TESTS: '1'
      AGENT_DEVICE_XCUITEST_ARCHS: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Restore and build iOS XCTest runner
        uses: ./.github/actions/setup-apple-runner-build
        with:
          derived-path: ${{ env.AGENT_DEVICE_IOS_RUNNER_DERIVED_PATH }}
          cache-key-prefix: ios-runner-prebuilt
          cache-key-suffix: -ios-${{ env.IOS_RUNTIME_VERSION }}-1874-${{ matrix.arch }}
          gate: swift-runner-ios
          xcuitest-platform: ios
          xcuitest-destination: generic/platform=iOS Simulator

      - name: Boot iOS test simulator
        id: ios-simulator
        uses: ./.github/actions/boot-ios-test-simulator
        with:
          runtime-version: ${{ env.IOS_RUNTIME_VERSION }}
          preferred-device-name: iPhone 17 Pro

      - name: Stall loop
        run: |
          set -euo pipefail
          XCTESTRUN_PATH="$(find "$AGENT_DEVICE_IOS_RUNNER_DERIVED_PATH/Build/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)"
          test -n "$XCTESTRUN_PATH"
          UDID="${{ steps.ios-simulator.outputs.simulator-udid }}"
          ITER="${{ github.event.inputs.iterations || '25' }}"
          TEST_NAME=testBareTypeUsesTappedInputWhenSoftwareKeyboardIsHidden
          # Above this, capture the cadence even though the iteration passed. Keyed on elapsed
          # time, not poll count: the 2026-08-26 dispatch of this workflow found both shapes, and
          # only one of them is poll-heavy. Its healthy iterations ran 628-1131 ms (n=50, median
          # 796/702 ms per leg), against a 2487 ms/5-poll episode on record and two single-poll
          # outliers of 4.0 s and 14.1 s — where the commit settled on the FIRST poll, so the time
          # was spent before the wait, not in it. 2000 ms sits above every healthy iteration
          # measured and below every episode.
          SLOW_PASS_MS=2000
          mkdir -p .tmp

          if [ "${{ matrix.mode }}" = "pair" ]; then
            EXTRA_ONLY_TESTING=(-only-testing:AgentDeviceRunnerUITests/RunnerTests/testBareDelayedTypeFailsWhenTappedInputDisappearsMidCommand)
          else
            EXTRA_ONLY_TESTING=()
          fi

          sys_prof="$(system_profiler SPHardwareDataType 2>/dev/null | grep -E 'Chip|Cores|Memory' || true)"
          echo "HOST: $sys_prof" | tee stall-summary.txt

          pass=0; skipped=0; fail=0
          for i in $(seq 1 "$ITER"); do
            LOG=".tmp/stall-run-$i.log"
            set +e
            xcodebuild test-without-building \
              -xctestrun "$XCTESTRUN_PATH" \
              -destination "platform=iOS Simulator,id=$UDID" \
              -only-testing:"AgentDeviceRunnerUITests/RunnerTests/$TEST_NAME" \
              ${EXTRA_ONLY_TESTING[@]+"${EXTRA_ONLY_TESTING[@]}"} \
              > "$LOG" 2>&1
            rc=$?
            set -e
            # xcodebuild's own verdict word, not pass-or-everything-else: since #2035 the test
            # can legitimately skip (XCTSkipIf on an ambient software keyboard), and a selection
            # that matches nothing reports no verdict at all. Counting either as a stall would
            # manufacture a 100% failure rate out of an environment flip or a bad selector.
            verdict="$(sed -n "s/.*$TEST_NAME]' \([a-z]*\).*/\1/p" "$LOG" | tail -1)"
            verdict="${verdict:-no-result}"
            phase="$(grep -o 'phase=type-all durationMs=[0-9.]*' "$LOG" | tail -1)"
            duration_ms="${phase##*=}"; duration_ms="${duration_ms%%.*}"; duration_ms="${duration_ms:-0}"
            polls="$(grep -c 'DEBUG-1874] poll' "$LOG" || true)"
            case "$verdict" in
              passed) pass=$((pass+1)) ;;
              skipped) skipped=$((skipped+1)) ;;
              *) fail=$((fail+1)) ;;
            esac
            echo "iter=$i verdict=$verdict rc=$rc $phase polls=$polls" | tee -a stall-summary.txt
            # The cadence is the artifact. An absorbed episode passes, so keying the dump on
            # failure alone would report only the episodes bad enough to still be red.
            if [ "$verdict" != passed ] || [ "$duration_ms" -gt "$SLOW_PASS_MS" ]; then
              grep 'DEBUG-1874' "$LOG" | head -40 | tee -a stall-summary.txt
              cp "$LOG" ".tmp/stall-evidence-$i.log"
            fi
          done

          echo "RESULT arch=${{ matrix.arch }} mode=${{ matrix.mode }}: $pass passed, $skipped skipped, $fail stalled of $ITER" | tee -a stall-summary.txt

      - name: Upload stall evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stall-evidence-${{ matrix.arch }}-${{ matrix.mode }}
          path: |
            stall-summary.txt
            .tmp/stall-evidence-*.log
          if-no-files-found: ignore
